n>过滤后仍可展开和配置星标雀士的服饰</figcaption></figure><figure><a href="random-no-favorites.png" target="_blank"><img src="random-no-favorites.png" loading="lazy"></a><figcaption>没有星标：显示空提示；左侧候选继续保留</figcaption></figure></div><h2>16:9 布局</h2><div class="grid"><figure><a href="switch-16x9.png" target="_blank"><img src="switch-16x9.png" loading="lazy"></a><figcaption>切换雀士 · 16:9</figcaption></figure><figure><a href="random-16x9.png" target="_blank"><img src="random-16x9.png" loading="lazy"></a><figcaption>随机配置 · 16:9</figcaption></figure></div><footer>全部效果图来自当前 Unity 工程实际渲染。随机页星标过滤已核对：全部／仅星标／无星标、服饰展开、候选保留和弹层关闭。核对通过编辑器验证入口驱动界面选择，滚动沿用共用运行时手势路由；没有进行手机真机触摸验证。<br>0.6.5 发布前实际截图；最终安装包、单元测试和发布记录见本版交接文档。</footer></main></html>
